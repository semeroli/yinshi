<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>文章管理 · 诗境</title>
    <meta name="theme-color" content="#F7F4EC" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <link rel="stylesheet" href="/assets/css/blog.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="/">
          <span class="seal" aria-hidden="true">诗</span>
          <span>诗境</span>
        </a>
        <nav class="topnav" aria-label="主导航">
          <a href="/app.html">创作台</a>
          <a href="/blog.html">诗话</a>
          <a href="/admin.html">用户</a>
          <span class="user-name" id="admin-name"></span>
          <button type="button" id="btn-logout">退出</button>
        </nav>
      </div>
    </header>

    <main class="wrap admin-main">
      <div class="admin-head">
        <div>
          <span class="eyebrow">管理</span>
          <h1>文章管理</h1>
        </div>
        <div class="head-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh">刷新</button>
          <a class="btn btn-primary btn-sm" href="/admin-editor.html">新建文章</a>
        </div>
      </div>

      <section class="stats" id="stats" hidden>
        <div class="stat">
          <span class="stat-label">文章总数</span>
          <strong id="stat-total">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">已发布</span>
          <strong id="stat-published">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">草稿</span>
          <strong id="stat-draft">0</strong>
        </div>
      </section>

      <section class="table-panel" id="table-panel" hidden>
        <div class="table-scroll">
          <table class="post-table">
            <thead>
              <tr>
                <th scope="col">封面</th>
                <th scope="col">标题</th>
                <th scope="col">状态</th>
                <th scope="col">更新时间</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="post-rows"></tbody>
          </table>
        </div>
      </section>

      <div class="state-box" id="state-box">
        <span class="spinner"></span>
        <p>正在读取文章…</p>
      </div>

      <div class="state-box" id="empty-box" hidden>
        <div class="seal" style="--seal-size: 46px; font-size: 22px; box-shadow: none; opacity: 0.4">空</div>
        <h2>还没有文章</h2>
        <p>点击「新建文章」写下第一篇诗话，支持 Markdown 与图床封面链接。</p>
        <a class="btn btn-primary btn-sm" href="/admin-editor.html">新建文章</a>
      </div>

      <div class="state-box" id="forbidden" hidden>
        <div class="seal" style="--seal-size: 46px; font-size: 22px; opacity: 0.4; box-shadow: none">禁</div>
        <h2>无权访问</h2>
        <p>文章管理仅管理员可用。请在服务端设置 <code>ADMIN_USERNAME</code> 并以该用户名登录。</p>
        <a class="btn btn-ghost btn-sm" href="/app.html">回到创作台</a>
      </div>
    </main>

    <script src="/assets/js/api.js" type="module"></script>
    <script src="/assets/js/admin-posts.js" type="module"></script>
  </body>
</html>
