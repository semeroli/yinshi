<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>注册 · 诗境</title>
    <meta name="theme-color" content="#F7F4EC" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <aside class="auth-aside" aria-hidden="true">
        <a class="brand" href="/">
          <span class="seal" aria-hidden="true">诗</span>
          <span>诗境</span>
        </a>
        <blockquote class="aside-quote">
          <p>空山新雨歇，</p>
          <p>松径落云深。</p>
          <p>独坐听流泉，</p>
          <p>苔痕上石心。</p>
          <cite>—— 演示作品《山居》</cite>
        </blockquote>
        <p class="aside-note">以君之意，成君之诗</p>
      </aside>

      <section class="auth-main">
        <div class="auth-card">
          <span class="eyebrow">初次相逢</span>
          <h1>注册账号</h1>
          <p class="auth-sub">注册后即可创作、收藏与回溯。</p>

          <form id="auth-form" novalidate>
            <div class="field">
              <label for="username">用户名</label>
              <input
                id="username"
                class="input"
                name="username"
                autocomplete="username"
                placeholder="2~20 位，支持中文"
              />
            </div>
            <div class="field">
              <label for="email">邮箱 <span class="optional">选填</span></label>
              <input id="email" class="input" type="email" name="email" autocomplete="email" placeholder="用于找回账号" />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <div class="pwd-wrap">
                <input
                  id="password"
                  class="input"
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  placeholder="至少 6 位"
                />
                <button type="button" class="pwd-toggle" aria-label="显示密码">显示</button>
              </div>
              <div class="pwd-meter" aria-hidden="true"><i></i><i></i><i></i></div>
              <p class="hint" id="pwd-hint">建议包含字母与数字</p>
            </div>
            <div id="turnstile-slot"></div>
            <p class="error-text" id="auth-error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-block" id="auth-submit">注册并开始题诗</button>
            <p class="auth-switch">已有账号？<a href="/login.html">直接登录</a></p>
          </form>
        </div>
        <a class="back-home" href="/">← 返回首页</a>
      </section>
    </main>

    <script src="/assets/js/api.js" type="module"></script>
    <script src="/assets/js/auth.js" type="module" data-page="register"></script>
  </body>
</html>
