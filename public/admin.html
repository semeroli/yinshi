<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>管理后台 · 诗境</title>
    <meta name="theme-color" content="#F7F4EC" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="/">
          <span class="seal" aria-hidden="true">诗</span>
          <span>诗境</span>
        </a>
        <nav class="topnav" aria-label="主导航">
          <a href="/app.html">创作台</a>
          <a href="/blog.html">诗话</a>
          <a href="/admin-posts.html">文章</a>
          <span class="user-name" id="admin-name"></span>
          <button type="button" id="btn-logout">退出</button>
        </nav>
      </div>
    </header>

    <main class="wrap admin-main">
      <div class="admin-head">
        <div>
          <span class="eyebrow">管理</span>
          <h1>注册用户</h1>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh">刷新</button>
      </div>

      <section class="stats" id="stats" hidden>
        <div class="stat">
          <span class="stat-label">总用户</span>
          <strong id="stat-total">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">今日新增</span>
          <strong id="stat-today">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">近 7 天</span>
          <strong id="stat-week">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">管理员</span>
          <strong id="stat-admins">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">已停用</span>
          <strong id="stat-disabled">0</strong>
        </div>
      </section>

      <div class="admin-toolbar" id="toolbar" hidden>
        <label class="search-box">
          <span class="visually-hidden">搜索用户</span>
          <input
            type="search"
            id="user-search"
            placeholder="搜用户名 / 邮箱 / 编号"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <span class="toolbar-hint" id="list-hint"></span>
      </div>

      <section class="table-panel" id="table-panel" hidden>
        <div class="table-scroll">
          <table class="user-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">用户名</th>
                <th scope="col">邮箱</th>
                <th scope="col">角色</th>
                <th scope="col">注册时间</th>
                <th scope="col">最近登录</th>
                <th scope="col">状态</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="user-rows"></tbody>
          </table>
        </div>
      </section>

      <div class="state-box" id="state-box">
        <span class="spinner"></span>
        <p>正在读取用户列表…</p>
      </div>

      <div class="state-box" id="forbidden" hidden>
        <div class="seal" style="--seal-size: 46px; font-size: 22px; opacity: 0.4; box-shadow: none">禁</div>
        <h2>无权访问</h2>
        <p>此页面仅管理员可见。如需权限，请在服务端设置 <code>ADMIN_USERNAME</code> 并以该用户名注册。</p>
        <a class="btn btn-ghost btn-sm" href="/app.html">回到创作台</a>
      </div>
    </main>

    <dialog class="pwd-dialog" id="pwd-dialog" aria-labelledby="pwd-title">
      <form id="pwd-form" novalidate>
        <h2 id="pwd-title">重置密码</h2>
        <p class="pwd-target">用户：<strong id="pwd-user"></strong></p>

        <label class="pwd-field">
          <span>新密码</span>
          <input
            type="password"
            id="pwd-input"
            name="password"
            minlength="6"
            maxlength="64"
            autocomplete="new-password"
            spellcheck="false"
          />
        </label>

        <div class="pwd-row">
          <label class="pwd-show"><input type="checkbox" id="pwd-show" /> 显示密码</label>
          <button type="button" class="btn btn-ghost btn-sm" id="pwd-copy">复制</button>
        </div>

        <p class="pwd-hint" id="pwd-hint">
          6~64 位。改完后这个用户已登录的页面会立即失效，需要用新密码重新登录；
          重置前建议先跟他确认一句。
        </p>
        <p class="error-text" id="pwd-error" role="alert"></p>

        <div class="pwd-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="pwd-cancel">取消</button>
          <button type="submit" class="btn btn-primary btn-sm" id="pwd-submit">确认重置</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/js/api.js" type="module"></script>
    <script src="/assets/js/admin.js" type="module"></script>
  </body>
</html>
